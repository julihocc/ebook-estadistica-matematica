name = "lean_verificacion"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LeanVerificacion"]
packagesDir = "C:/lake_pkgs"

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.2"

[[lean_lib]]
name = "LeanVerificacion"
